<!DOCTYPE html>
<html>
  <head><meta charset="utf-8" /><meta name="robots" content="noindex" /><title>Forms</title></head>
  <body>
    <!-- Static skeleton so Netlify registers the footer feedback form at deploy time.
         Field names must match src/components/FeedbackModal.tsx exactly. -->
    <form name="feedback" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="feedback" />
      <input type="hidden" name="subject" />
      <input type="hidden" name="language" />
      <input name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
